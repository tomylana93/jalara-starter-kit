version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    # Dependabot's own commits and pull request titles have to satisfy the same
    # Conventional Commit gate. We specify the exact prefix to avoid deps-dev variation.
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns:
          - '*'

  # Application dependencies need a remediation path, not only a detector. The
  # `audit` job in `tests.yml` blocks a pull request that introduces a vulnerable
  # package, but it can never raise the version that fixes one; these entries do.
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      composer:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns:
          - '*'
