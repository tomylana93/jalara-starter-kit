version: 2
updates:
  # Every pull request Dependabot opens goes through the same gate and the same
  # squash-merge policy as a hand-written one, and none of them merge
  # automatically: a dependency bump that passes CI is still a change somebody
  # has to accept.
  #
  # `target-branch` is named rather than left to the default so a repository that
  # still has an older branch cannot receive updates against it.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    # Dependabot's own commits and pull request titles have to satisfy the same
    # Conventional Commit gate. We specify the exact prefix to avoid deps-dev variation.
    commit-message:
      prefix: 'chore(deps)'
    # Actions are pinned to a full commit SHA, which Dependabot understands and
    # keeps updating; the version comment beside each pin is what it rewrites.
    #
    # Majors arrive on their own so one breaking upgrade cannot hold the rest
    # hostage.
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # Application dependencies need a remediation path, not only a detector. The
  # audit blocks a pull request that introduces a vulnerable package, but it can
  # never raise the version that fixes one; these entries do.
  - package-ecosystem: 'composer'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      composer:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # TypeScript 7.0 ships without a public compiler API. Vue tooling and
      # typescript-eslint both depend on that API, so the upgrade breaks
      # `eslint .` and `vite build` outright rather than needing configuration
      # work. Microsoft expects the API to return in 7.1; typescript-eslint has
      # no released support and calls the port months from stable.
      #
      # Lift this once BOTH hold:
      #   - TypeScript >= 7.1 restores the public compiler API
      #   - typescript-eslint ships a release that accepts TypeScript 7
      #     (https://github.com/typescript-eslint/typescript-eslint/issues/10940)
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    # Majors are deliberately left ungrouped so each arrives in its own pull
    # request. A single group covering everything let one breaking upgrade hold
    # ten unrelated updates hostage and made the failure hard to attribute.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
