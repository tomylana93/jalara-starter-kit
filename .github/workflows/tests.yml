name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited

permissions:
  contents: read

# Superseded runs for the same branch or pull request are pointless work: only
# the newest revision can still be merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The tiering rule for the whole workflow. Draft pull requests and pushes to an
# ordinary branch get the fast gate; ready pull requests and `main` — the two
# points where code is actually promoted — get the full one.
env:
  RUN_FULL: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Setup Application
        run: composer run ci:setup

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      # Only the full gate runs Playwright, so the browser download stays out of
      # the routine feedback loop.
      - name: Install Chromium
        if: env.RUN_FULL == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the fast CI gate
        if: env.RUN_FULL != 'true'
        run: composer run ci:check

      - name: Run the full CI gate
        if: env.RUN_FULL == 'true'
        run: composer run ci:full

  # Validates the Conventional Commit contract that Release Please reads to
  # derive the next version and the changelog. Merge commits are exempt: the
  # repository promotes `dev` into `main` with a merge commit.
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the pull request title and its commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          status=0

          if ! printf '%s' "${PR_TITLE}" | grep -Eq "${pattern}"; then
            echo "::error::Pull request title is not a Conventional Commit: ${PR_TITLE}"
            status=1
          fi

          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > "${RUNNER_TEMP}/subjects.txt"

          while IFS= read -r subject; do
            [ -n "${subject}" ] || continue
            if ! printf '%s' "${subject}" | grep -Eq "${pattern}"; then
              echo "::error::Commit subject is not a Conventional Commit: ${subject}"
              status=1
            fi
          done < "${RUNNER_TEMP}/subjects.txt"

          if [ "${status}" -ne 0 ]; then
            echo 'Use: <type>(<optional scope>): <english description>'
            echo 'Allowed types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert.'
            exit 1
          fi

          echo 'Every pull request title and non-merge commit follows the convention.'

  # Reproduces every material stage of the installation command documented in
  # the README:
  #
  #   laravel new my-app --using=<repo URL> --database=sqlite --pnpm \
  #     --no-boost --no-interaction
  #
  # The application is exported into an empty directory and booted by Composer
  # before any environment file, SQLite file, or migrated schema exists. The
  # export stands in for `npx tiged <url>`, which would otherwise fetch the
  # default branch instead of the code under review. `--no-interaction` and
  # `--no-boost` are reproduced by omission: they only suppress the installer's
  # Pest and Boost scaffolding, which must never run against this starter kit.
  #
  # This job deliberately sets no APP_ENV, because the production fallback
  # during the pre-environment window is exactly what it has to cover.
  #
  # The scenario only describes the public starter kit, so private descendants
  # skip it. It runs as an independent parallel full-tier job to minimize overall CI wall
  # time and preserve the hosted <=5-minute target.
  installer:
    name: installer
    if: >-
      github.repository == 'tomylana93/jalara-starter-kit' &&
      ((github.event_name == 'push' && github.ref_name == 'main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11'

      - name: Export the starter kit into an empty directory
        run: |
          mkdir -p "${RUNNER_TEMP}/jalara-app"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/jalara-app"

      - name: Install dependencies without an environment file
        working-directory: ${{ runner.temp }}/jalara-app
        run: composer install --no-interaction --prefer-dist

      - name: Initialize the application
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          composer run post-root-package-install
          php artisan key:generate --no-interaction

      - name: Run the starter kit installer hooks
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          php -r '
            $composer = json_decode(file_get_contents("composer.json"), true);
            $hooks = $composer["extra"]["laravel"]["installer"]["post-create-project"] ?? [];
            foreach ($hooks as $hook) {
                $command = preg_replace("/^@php /", PHP_BINARY . " ", $hook);
                fwrite(STDOUT, "> {$command}\n");
                passthru($command, $status);
                if ($status !== 0) {
                    exit($status);
                }
            }
          '

      - name: Migrate the SQLite database
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          touch database/database.sqlite
          php artisan migrate --no-interaction

      # `--pnpm` makes the installer delete every other package manager's lock
      # file and rewrite the `dev`, `dev:ssr`, and `setup` Composer scripts.
      # Both must leave Jalara's locked pnpm setup exactly as committed.
      - name: Verify the pnpm package manager contract
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test ! -f yarn.lock
          test ! -f bun.lockb
          php -r '
            $scripts = json_decode(file_get_contents("composer.json"), true)["scripts"];
            foreach (["dev", "dev:ssr", "setup"] as $key) {
                if (! array_key_exists($key, $scripts)) {
                    continue;
                }
                $rewritten = str_replace(
                    ["npm", "npx", "ppnpm"],
                    ["pnpm", "pnpm dlx", "pnpm"],
                    $scripts[$key],
                );
                if ($rewritten !== $scripts[$key]) {
                    fwrite(STDERR, "The [{$key}] script is rewritten by the installer under --pnpm:\n");
                    fwrite(STDERR, json_encode($rewritten, JSON_PRETTY_PRINT) . "\n");
                    exit(1);
                }
            }
            fwrite(STDOUT, "Composer scripts survive the --pnpm rewrite unchanged.\n");
          '

      - name: Install and build the frontend with pnpm
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify the application boots
        working-directory: ${{ runner.temp }}/jalara-app
        run: php artisan about --only=environment
