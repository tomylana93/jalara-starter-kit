name: Pest TIA baseline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-interaction)" >> "$GITHUB_ENV"

      - name: Record baseline
        run: composer run test:tia:fresh

      - name: Locate baseline
        id: baseline
        run: |
          baseline_output="$(composer run test:tia:baseline --no-interaction | tail -n 1)"
          baseline_path="$(php -r '$decoded = json_decode($argv[1], true); echo is_array($decoded) ? $decoded["raw"][0] : $argv[1];' "$baseline_output")"
          echo "path=$baseline_path" >> "$GITHUB_OUTPUT"

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}
          if-no-files-found: error
