name: gate

# The one implementation of the full gate. Pull requests and the default branch
# both call it, so "the checks that ran on the pull request" and "the checks that
# ran on `main`" are the same set by construction rather than by convention.
#
# There is no fast tier inside this file. Tiering is the caller's decision: a
# draft pull request never calls this workflow at all.
on:
  workflow_call:
    inputs:
      scope:
        description: >-
          `full` runs every check. `release` runs only the packaging checks, for
          the release pull request, whose candidate has already been through the
          full gate on the default branch.
        type: string
        required: false
        default: full

# Nothing is granted at the top of the file: every job below asks for the read
# access it needs and no job inherits more than that.
permissions: {}

jobs:
  # The first stage runs everything that only needs the source tree, in
  # parallel, so the slowest check rather than their sum sets the wall time.
  # `composer.json` keeps one script per job and composes them into `ci:check`
  # and `ci:full`, so the local gate provably runs the same set as CI.
  static:
    name: static analysis
    if: inputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # spatie/laravel-backup requires ext-zip; naming it here makes the
          # dependency explicit rather than relying on the runner's defaults.
          extensions: zip
          tools: composer:v2
          coverage: none

      # pnpm has to exist before `setup-node`, which shells out to it to locate
      # the store it caches.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Only the download cache is stored, never `vendor/`. The install still
      # runs, so Composer's platform checks keep validating the tree; a stale or
      # corrupt cache can make a run slow, never wrong.
      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      # PHPStan keeps a result cache that would otherwise land in the runner's
      # always-empty temporary directory. The key carries `composer.lock` and
      # the tool configuration, so a version or rule change produces a cold
      # cache rather than letting a stale one pass code the check should flag.
      #
      # The commit is appended so every run saves a freshened entry. Without it
      # a hit on the primary key ends in `not saving cache`, and the stored
      # result set stays frozen at whatever the first run after a dependency
      # bump produced.
      - name: Cache the static analysis results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-php8.5-analysis-${{ hashFiles('composer.lock', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php8.5-analysis-${{ hashFiles('composer.lock', 'phpstan.neon') }}-
            ${{ runner.os }}-php8.5-analysis-

      - name: Setup Application
        run: composer run ci:setup

      # ESLint, Prettier, and vue-tsc all read the generated route and action
      # modules, which are gitignored.
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run the static checks
        run: composer run ci:static

  vitest:
    name: vitest
    if: inputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP is not optional here: the Vue components under test import the
      # gitignored Wayfinder modules, which only Artisan can generate.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      - name: Setup Application
        run: composer run ci:setup

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run the Vitest suite
        run: composer run ci:vitest

  # `Tests\TestCase` calls `withoutVite()`, so nothing in the Pest suite reads a
  # built asset. That makes this the one job with no Node toolchain at all.
  #
  # The suite runs on both engines it claims to support in production. SQLite and
  # PostgreSQL disagree in ways no SQLite run can reveal - `LIKE` case
  # sensitivity, `MAX` over `uuid`, and whether a constraint violation aborts the
  # surrounding transaction - and each of those was a live defect here, found
  # only by adding the PostgreSQL leg. The SQLite leg stays because it is what a
  # default install runs on.
  #
  # The service major version and the `pg_dump` client on the runner must match:
  # `pg_dump` refuses to dump a newer server, which fails the backup suite with
  # nothing but an exit code to go on. ubuntu-latest ships the 16 client.
  pest:
    name: pest (${{ matrix.database }})
    if: inputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # One engine failing should still report the other, since the whole point
      # of the matrix is telling engine-specific breakage apart.
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            connection: sqlite
            name: ':memory:'
          - database: pgsql
            connection: pgsql
            name: jalara_test

    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.connection }}
      DB_DATABASE: ${{ matrix.name }}
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: jalara
      DB_PASSWORD: secret
      LARAVEL_BYPASS_ENV_CHECK: '1'

    # `phpunit.xml` names DB_CONNECTION too, but PHPUnit only applies an `<env>`
    # when the variable is absent from the real environment unless it is marked
    # `force`. The matrix therefore wins, and the file still drives a local run.
    #
    # The service starts for both legs; the SQLite leg simply never connects to
    # it. Conditional services are not expressible in a matrix, and a container
    # nobody dials costs far less than a second job definition to maintain.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jalara
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: jalara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip, pdo_pgsql, pgsql
          tools: composer:v2
          # Only the PostgreSQL leg measures coverage, but the driver is cheap
          # to install and keeping one PHP setup avoids a second expression.
          coverage: pcov

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      - name: Setup Application
        run: composer run ci:setup:php

      - name: Run the Pest suite
        if: matrix.database == 'sqlite'
        run: composer run ci:pest

      # Coverage is a property of the suite, not of the engine, so it is measured
      # once - on the engine production actually runs.
      - name: Run the Pest suite with coverage
        if: matrix.database == 'pgsql'
        run: composer run ci:pest:coverage

  # Advisory databases are a third-party input, so this job separates the two
  # ways it can fail. A published advisory against a locked dependency is a real
  # finding and blocks the gate. An unreachable advisory service is not a
  # finding, and saying so is the difference between "fix this dependency" and
  # "run it again".
  #
  # Both audits read a lock file and nothing else, so the job installs no
  # dependencies. Keeping them out of `ci:check` also makes that gate hermetic,
  # so a poor connection can no longer fail it for reasons that are not code.
  audit:
    name: dependency audit
    if: inputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Audit the locked dependencies
        run: .github/scripts/audit-dependencies.sh

  # The second stage costs a browser download and a production build, so it only
  # starts once the cheap checks have agreed the tree is worth it.
  e2e:
    name: end-to-end
    if: inputs.scope == 'full'
    needs:
      - static
      - vitest
      - pest
      - audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Sized against a bad day, not against the gate. A single cache miss on the
    # Playwright browsers once pushed a legitimate run to 887s — thirteen
    # seconds short of a fifteen-minute limit. A timeout that fires on a slow
    # download reads as a broken test suite and, on `main`, silently stops
    # releases.
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      - name: Setup Application
        run: composer run ci:setup

      # Deliberately uncached. `~/.cache/ms-playwright` was cached here and
      # measured on `main`: 22s with a cold cache, 22s with a warm one, plus 5s
      # to restore 269 MB. Almost all of the time is `--with-deps` installing
      # system libraries through apt, which no cache covers; the browser
      # download it does skip is the cheap part. Dropping `--with-deps` would
      # make a cache worth having, but it bets on which libraries the runner
      # image happens to ship and fails as an unexplained Chromium crash.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `e2e/run-tests.sh` performs the single production build the suite needs,
      # which regenerates the Wayfinder modules through the Vite plugin.
      - name: Run the end-to-end suite
        run: composer run ci:e2e

      # Only failures produce an artifact, and only the Playwright output. The
      # application log is deliberately left out: it is the one file that can
      # carry a rendered environment value, and no sanitizer here could promise
      # otherwise.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Reproduces every material stage of the installation command documented in
  # the README:
  #
  #   laravel new my-app --using=<repo URL> --database=sqlite --pnpm \
  #     --no-boost --no-interaction
  #
  # The application is exported into an empty directory and booted by Composer
  # before any environment file, SQLite file, or migrated schema exists. The
  # export stands in for `npx tiged <url>`, which would otherwise fetch the
  # default branch instead of the code under review. `--no-interaction` and
  # `--no-boost` are reproduced by omission: they only suppress the installer's
  # Pest and Boost scaffolding, which must never run against this starter kit.
  #
  # This job deliberately sets no APP_ENV, because the production fallback
  # during the pre-environment window is exactly what it has to cover.
  #
  # It runs everywhere, including in private descendants: a downstream
  # application that cannot be installed from a clean checkout is broken for its
  # own contributors, not only for this repository's users. Only the scheduled
  # run against the *published* repository is opt-in, in `installer-smoke.yml`.
  #
  # Because the stages are reproduced by hand, this job validates the installer
  # contract as this repository understands it, not the installer binary.
  installer:
    name: installer
    needs:
      - static
      - vitest
      - pest
      - audit
    # The release scope runs this job on its own, so it cannot simply depend on
    # the first stage: a skipped dependency skips the dependent job. Naming the
    # results explicitly keeps the ordering for a full run and still lets the
    # release pull request reach the packaging check.
    if: >-
      ${{ !cancelled() && (inputs.scope == 'release' ||
      (needs.static.result == 'success' &&
       needs.vitest.result == 'success' &&
       needs.pest.result == 'success' &&
       needs.audit.result == 'success')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # spatie/laravel-backup requires ext-zip; naming it here makes the
          # dependency explicit rather than relying on the runner's defaults.
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Export the starter kit into an empty directory
        run: |
          mkdir -p "${RUNNER_TEMP}/jalara-app"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/jalara-app"

      - name: Install dependencies without an environment file
        working-directory: ${{ runner.temp }}/jalara-app
        run: composer install --no-interaction --prefer-dist

      - name: Initialize the application
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          composer run post-root-package-install
          php artisan key:generate --no-interaction

      - name: Run the starter kit installer hooks
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          php -r '
            $composer = json_decode(file_get_contents("composer.json"), true);
            $hooks = $composer["extra"]["laravel"]["installer"]["post-create-project"] ?? [];
            foreach ($hooks as $hook) {
                $command = preg_replace("/^@php /", PHP_BINARY . " ", $hook);
                fwrite(STDOUT, "> {$command}\n");
                passthru($command, $status);
                if ($status !== 0) {
                    exit($status);
                }
            }
          '

      - name: Migrate the SQLite database
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          touch database/database.sqlite
          php artisan migrate --no-interaction

      # `--pnpm` makes the installer delete every other package manager's lock
      # file and rewrite the `dev`, `dev:ssr`, and `setup` Composer scripts.
      # Both must leave Jalara's locked pnpm setup exactly as committed.
      - name: Verify the pnpm package manager contract
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test ! -f yarn.lock
          test ! -f bun.lockb
          php -r '
            $scripts = json_decode(file_get_contents("composer.json"), true)["scripts"];
            foreach (["dev", "dev:ssr", "setup"] as $key) {
                if (! array_key_exists($key, $scripts)) {
                    continue;
                }
                $rewritten = str_replace(
                    ["npm", "npx", "ppnpm"],
                    ["pnpm", "pnpm dlx", "pnpm"],
                    $scripts[$key],
                );
                if ($rewritten !== $scripts[$key]) {
                    fwrite(STDERR, "The [{$key}] script is rewritten by the installer under --pnpm:\n");
                    fwrite(STDERR, json_encode($rewritten, JSON_PRETTY_PRINT) . "\n");
                    exit(1);
                }
            }
            fwrite(STDOUT, "Composer scripts survive the --pnpm rewrite unchanged.\n");
          '

      - name: Install and build the frontend with pnpm
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify the application boots
        working-directory: ${{ runner.temp }}/jalara-app
        run: php artisan about --only=environment
