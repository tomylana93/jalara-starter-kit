name: gate

# The one implementation of every gate. Each caller names a scope and gets the
# jobs that scope defines, so no caller can quietly grow a check the others do
# not have.
#
# The scopes are deliberately different from each other. A pull request answers
# "is this change correct?" as cheaply as the question allows; `main` answers
# "does the tree that actually landed still work on the engines we claim to
# support?". Running both sets in both places was the old design and it charged
# every change for a guarantee only the merge needs.
#
# Drift between them is prevented where it matters: every job invokes a
# `composer.json` script, so the command a job runs is the command a developer
# runs locally, and there is exactly one definition of it.
on:
  workflow_call:
    inputs:
      scope:
        description: >-
          `pull-request` runs verification and, when the diff touches the
          frontend, the browser suite. `main` runs database compatibility and a
          drift check. `release` runs only the packaging check, for the release
          pull request, whose candidate already passed both.
        type: string
        required: false
        default: pull-request

# Nothing is granted at the top of the file: every job below asks for the read
# access it needs and no job inherits more than that.
permissions: {}

jobs:
  # Static analysis, the Vitest suite, and the Pest suite in one job.
  #
  # They were three, and the split cost more than it bought: each paid a full
  # checkout, PHP setup, pnpm setup, Node setup, and `composer install` to run a
  # check measured in seconds. Bootstrap dominated, and paying it three times in
  # parallel still burns three runners. One job pays it once.
  #
  # Pest runs `--parallel` here, which is what makes the merge cheap rather than
  # merely tidy: the suite drops from roughly 23s to 5s, more than covering the
  # loss of cross-check parallelism.
  #
  # Frontend path detection lives here rather than in a third job so the PR gate
  # stays two jobs (`verify` + `browser`). The filter is job-level on purpose: a
  # path filter at the trigger makes the browser job *missing* on an unrelated
  # change, and a missing check is indistinguishable from one that never ran.
  # Filtering here keeps browser present and reported as skipped. That matters
  # on the Free plan, which has no required checks — a human cannot audit a
  # check that is not on the page.
  verify:
    name: verify
    if: inputs.scope == 'pull-request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'resources/js/**'
              - 'resources/css/**'
              - 'resources/views/**'
              - 'routes/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # spatie/laravel-backup requires ext-zip; naming it here makes the
          # dependency explicit rather than relying on the runner's defaults.
          extensions: zip
          tools: composer:v2
          # PCOV, not Xdebug: it is the cheaper driver for line coverage, and
          # nothing here needs a step debugger.
          coverage: pcov

      # pnpm has to exist before `setup-node`, which shells out to it to locate
      # the store it caches.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Only the download cache is stored, never `vendor/` or `node_modules/`.
      # The install still runs, so Composer's platform checks keep validating
      # the tree; a stale or corrupt cache can make a run slow, never wrong.
      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      # PHPStan keeps a result cache that would otherwise land in the runner's
      # always-empty temporary directory. The key carries `composer.lock` and
      # the tool configuration, so a version or rule change produces a cold
      # cache rather than letting a stale one pass code the check should flag.
      #
      # The commit is appended so every run saves a freshened entry. Without it
      # a hit on the primary key ends in `not saving cache`, and the stored
      # result set stays frozen at whatever the first run after a dependency
      # bump produced.
      - name: Cache the static analysis results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-php8.5-analysis-${{ hashFiles('composer.lock', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php8.5-analysis-${{ hashFiles('composer.lock', 'phpstan.neon') }}-
            ${{ runner.os }}-php8.5-analysis-

      - name: Setup Application
        run: composer run ci:setup

      # ESLint, Prettier, vue-tsc, and the Vue modules under test all read the
      # generated route and action modules, which are gitignored.
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run the static checks
        run: composer run ci:static

      - name: Run the Vitest suite
        run: composer run ci:vitest

      # Coverage is measured here rather than on a database leg: it is a
      # property of the suite, not of the engine, and this is the only leg a
      # pull request runs.
      - name: Run the Pest suite with coverage
        run: composer run coverage:check -- --parallel

  # The browser suite costs a Chromium download and a production build, so it
  # runs only when the diff could plausibly change what the browser sees, and
  # only once the cheap job has agreed the tree is worth it.
  #
  # Accepted consequence: a commit whose diff touches no frontend path can be
  # merged, and released, without this ever running. That is deliberate. The
  # alternative charges every backend-only change for a browser boot to defend
  # against a failure mode that change cannot cause.
  browser:
    name: browser
    if: >-
      ${{ inputs.scope == 'pull-request' &&
      needs.verify.outputs.frontend == 'true' }}
    needs:
      - verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Sized against a bad day, not against the gate. A single cache miss on the
    # Playwright browsers once pushed a legitimate run to 887s — thirteen
    # seconds short of a fifteen-minute limit. A timeout that fires on a slow
    # download reads as a broken test suite.
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      - name: Setup Application
        run: composer run ci:setup

      # Browser binaries are keyed on the locked Playwright version so a bump
      # forces a cold download and a pin keeps the warm cache. System libraries
      # from `--with-deps` are still installed every run; only the browser
      # download itself is what the cache skips.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "${GITHUB_OUTPUT}"

      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The browser suite reads the ordinary `public/build`. Nothing in
      # `composer run ci:browser` builds it, so the bundle is produced here. It
      # also regenerates the Wayfinder modules through the Vite plugin.
      - name: Build the production bundle
        run: pnpm run build

      # No `--parallel` here. The runner has two cores, and driving several
      # Chromium instances across them is slower than one and measurably
      # flakier.
      - name: Run the browser suite
        run: composer run ci:browser

      # Only failures produce an artifact, and only the screenshots Pest writes
      # for a failed browser expectation. The application log is deliberately
      # left out: it is the one file that can carry a rendered environment
      # value, and no sanitizer here could promise otherwise.
      - name: Upload the browser screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # The engines this kit claims to support, run against the tree that actually
  # landed.
  #
  # SQLite and a server engine disagree in ways no SQLite run can reveal —
  # `LIKE` case sensitivity, `MAX` over `uuid`, whether a constraint violation
  # aborts the surrounding transaction — and each of those was a live defect
  # here, found only by adding a server leg. Those are merge-time properties,
  # not per-change ones, so the cost belongs here rather than on every push to
  # a branch.
  #
  # `--parallel` here matches every other non-browser Pest leg. Each worker
  # gets its own database name via Laravel's parallel testing tokens; the
  # service containers already expose CREATE DATABASE to the configured user.
  compat:
    name: compat (${{ matrix.database }})
    if: inputs.scope == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One engine failing should still report the other, since the whole point
      # of the matrix is telling engine-specific breakage apart.
      fail-fast: false
      matrix:
        include:
          - database: pgsql
            port: '5432'
          - database: mysql
            port: '3306'

    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: jalara_test
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: jalara
      DB_PASSWORD: secret
      LARAVEL_BYPASS_ENV_CHECK: '1'

    # `phpunit.xml` names DB_CONNECTION too, but PHPUnit only applies an `<env>`
    # when the variable is absent from the real environment unless it is marked
    # `force`. The matrix therefore wins, and the file still drives a local run.
    #
    # Both services start for both legs; the leg that does not use one simply
    # never dials it. Conditional services are not expressible in a matrix, and
    # an idle container costs far less than a second job definition to maintain.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jalara
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: jalara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: jalara
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: jalara_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujalara -psecret --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `pg_dump` refuses to dump a server newer than itself and fails the
      # backup suite with nothing but an exit code to go on. ubuntu-latest ships
      # the 16 client, so pinning the service at 17 obliges this step: the
      # client major must be installed to match the server major, in the same
      # change that moves it.
      - name: Install the PostgreSQL 17 client
        if: matrix.database == 'pgsql'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip, pdo_pgsql, pgsql, pdo_mysql, mysql
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      # `Tests\TestCase` calls `withoutVite()`, so nothing outside the browser
      # suite reads a built asset. That is what lets this job skip Node.
      - name: Setup Application
        run: composer run ci:setup:php

      - name: Run the Pest suite
        run: composer run ci:pest -- --parallel

  # The same SQLite run a pull request made, repeated against the merge result.
  #
  # Without protected branches or a merge queue — neither of which the Free plan
  # offers — nothing guarantees the tree that was tested is the tree that
  # landed. This is the cheapest check that says so.
  drift:
    name: drift
    if: inputs.scope == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      LARAVEL_BYPASS_ENV_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-composer-

      - name: Setup Application
        run: composer run ci:setup:php

      - name: Run the Pest suite
        run: composer run ci:pest -- --parallel

  # Reproduces every material stage of the installation command documented in
  # the README:
  #
  #   laravel new my-app --using=<repo URL> --database=sqlite --pnpm \
  #     --no-boost --no-interaction
  #
  # The application is exported into an empty directory and booted by Composer
  # before any environment file, SQLite file, or migrated schema exists. The
  # export stands in for `npx tiged <url>`, which would otherwise fetch the
  # default branch instead of the code under review. `--no-interaction` and
  # `--no-boost` are reproduced by omission: they only suppress the installer's
  # Pest and Boost scaffolding, which must never run against this starter kit.
  #
  # This job deliberately sets no APP_ENV, because the production fallback
  # during the pre-environment window is exactly what it has to cover.
  #
  # Because the stages are reproduced by hand, this job validates the installer
  # contract as this repository understands it, not the installer binary.
  installer:
    name: installer
    if: inputs.scope == 'release'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Export the starter kit into an empty directory
        run: |
          mkdir -p "${RUNNER_TEMP}/jalara-app"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/jalara-app"

      - name: Install dependencies without an environment file
        working-directory: ${{ runner.temp }}/jalara-app
        run: composer install --no-interaction --prefer-dist

      - name: Initialize the application
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          composer run post-root-package-install
          php artisan key:generate --no-interaction

      - name: Run the starter kit installer hooks
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          php -r '
            $composer = json_decode(file_get_contents("composer.json"), true);
            $hooks = $composer["extra"]["laravel"]["installer"]["post-create-project"] ?? [];
            foreach ($hooks as $hook) {
                $command = preg_replace("/^@php /", PHP_BINARY . " ", $hook);
                fwrite(STDOUT, "> {$command}\n");
                passthru($command, $status);
                if ($status !== 0) {
                    exit($status);
                }
            }
          '

      - name: Migrate the SQLite database
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          touch database/database.sqlite
          php artisan migrate --no-interaction

      # `--pnpm` makes the installer delete every other package manager's lock
      # file and rewrite the `dev`, `dev:ssr`, and `setup` Composer scripts.
      # Both must leave Jalara's locked pnpm setup exactly as committed.
      - name: Verify the pnpm package manager contract
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test ! -f yarn.lock
          test ! -f bun.lockb
          php -r '
            $scripts = json_decode(file_get_contents("composer.json"), true)["scripts"];
            foreach (["dev", "dev:ssr", "setup"] as $key) {
                if (! array_key_exists($key, $scripts)) {
                    continue;
                }
                $rewritten = str_replace(
                    ["npm", "npx", "ppnpm"],
                    ["pnpm", "pnpm dlx", "pnpm"],
                    $scripts[$key],
                );
                if ($rewritten !== $scripts[$key]) {
                    fwrite(STDERR, "The [{$key}] script is rewritten by the installer under --pnpm:\n");
                    fwrite(STDERR, json_encode($rewritten, JSON_PRETTY_PRINT) . "\n");
                    exit(1);
                }
            }
            fwrite(STDOUT, "Composer scripts survive the --pnpm rewrite unchanged.\n");
          '

      - name: Install and build the frontend with pnpm
        working-directory: ${{ runner.temp }}/jalara-app
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify the application boots
        working-directory: ${{ runner.temp }}/jalara-app
        run: php artisan about --only=environment
