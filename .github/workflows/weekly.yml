name: weekly

# The checks that answer a question time changes rather than a commit changes.
#
# Neither belongs on a pull request. One depends on a third-party advisory
# database that can publish against code already merged; the other depends on an
# upstream installer and a live registry. Both would charge every change for a
# non-hermetic dependency, and a failure in either says nothing about the diff
# under review.
#
# They share a schedule because they share that property, not because they are
# related.
#
# GitHub disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  # The pull-request gate no longer audits lock files on every change: a published
  # advisory against code that was already merged is a property of the calendar,
  # not of a diff. Dependabot owns the remediation; this owns noticing.
  audit:
    name: audit the locked dependencies
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Audit the locked dependencies
        run: .github/scripts/audit-dependencies.sh

  # Runs the installation command exactly as the README documents it, against the
  # real Laravel installer and the published repository.
  #
  # The `installer` job in the release scope reproduces the installer's stages by
  # hand so it can test the commit under review instead of the default branch.
  # That makes it fast and precise, but it validates the contract as this
  # repository understands it — including a hand-copied version of the
  # installer's `--pnpm` script rewrite. If the installer changes that logic, the
  # simulation stays green while real installations break. This job is what
  # notices.
  #
  # It is opt-in through `STARTER_KIT_MODE`, because it only means anything for a
  # repository that publishes itself as a starter kit. A private application
  # built from this one has no such contract, and a weekly failure it cannot act
  # on is noise.
  #
  # It also stays out of the merge gate on purpose: the non-hermetic failures it
  # invites — an upstream installer bug, a registry outage — must never colour a
  # gate that release eligibility reads.
  smoke:
    name: laravel new
    if: vars.STARTER_KIT_MODE == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The installer clones over HTTPS, which a private repository refuses
      # anonymously. Being private is not a failure — it is the default for a
      # descendant — so it is reported and skipped rather than failed.
      - name: Resolve how the repository can be fetched
        id: access
        env:
          PRIVATE: ${{ github.event.repository.private }}
          INSTALL_TOKEN: ${{ secrets.STARTER_KIT_INSTALL_TOKEN }}
        run: |
          if [ "${PRIVATE}" != 'true' ]; then
            echo 'fetchable=true' >> "${GITHUB_OUTPUT}"
          elif [ -n "${INSTALL_TOKEN}" ]; then
            echo 'fetchable=true' >> "${GITHUB_OUTPUT}"
            git config --global \
              "url.https://x-access-token:${INSTALL_TOKEN}@github.com/.insteadOf" \
              'https://github.com/'
          else
            echo 'fetchable=false' >> "${GITHUB_OUTPUT}"
            {
              echo '## The remote installer check needs a read credential'
              echo
              echo 'This repository is private, so the Laravel installer cannot clone it'
              echo 'anonymously. Add a read-only `STARTER_KIT_INSTALL_TOKEN` secret, or'
              echo 'unset `STARTER_KIT_MODE` if this repository is not published as a'
              echo 'starter kit.'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup PHP
        if: steps.access.outputs.fetchable == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.access.outputs.fetchable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        if: steps.access.outputs.fetchable == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'

      - name: Install the Laravel installer
        if: steps.access.outputs.fetchable == 'true'
        run: |
          composer global require laravel/installer --no-interaction
          echo "$(composer config --global home)/vendor/bin" >> "${GITHUB_PATH}"

      - name: Report the installer version under test
        if: steps.access.outputs.fetchable == 'true'
        run: laravel --version

      - name: Install the starter kit with the documented command
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          laravel new jalara-smoke \
            --using="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --database=sqlite \
            --pnpm \
            --no-boost \
            --no-interaction

      # These assertions mirror the `installer` job in the release scope. They
      # have to stay in step: divergence between the simulation and the real
      # installer is the only thing this job exists to detect.
      - name: Verify the pnpm package manager contract
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}/jalara-smoke
        run: |
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test ! -f yarn.lock
          test ! -f bun.lockb
          php -r '
            $scripts = json_decode(file_get_contents("composer.json"), true)["scripts"];
            foreach (["dev", "dev:ssr", "setup"] as $key) {
                if (! array_key_exists($key, $scripts)) {
                    continue;
                }
                $rewritten = str_replace(
                    ["npm", "npx", "ppnpm"],
                    ["pnpm", "pnpm dlx", "pnpm"],
                    $scripts[$key],
                );
                if ($rewritten !== $scripts[$key]) {
                    fwrite(STDERR, "The [{$key}] script was rewritten by the real installer:\n");
                    fwrite(STDERR, json_encode($scripts[$key], JSON_PRETTY_PRINT) . "\n");
                    exit(1);
                }
            }
            fwrite(STDOUT, "Composer scripts survive the --pnpm rewrite unchanged.\n");
          '

      - name: Verify the environment and database were initialized
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}/jalara-smoke
        run: |
          test -f .env
          test -f database/database.sqlite
          php artisan migrate:status --no-interaction

      - name: Build the frontend
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}/jalara-smoke
        run: pnpm run build

      - name: Verify the application boots
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}/jalara-smoke
        run: php artisan about --only=environment

      - name: Run the installed test suite
        if: steps.access.outputs.fetchable == 'true'
        working-directory: ${{ runner.temp }}/jalara-smoke
        run: php artisan test --compact
