name: release

# Runs only after the full `tests` gate has finished successfully on `main`, so
# no changelog, tag, or release is ever produced from unverified code.
#
# `workflow_dispatch` is the manual escape hatch: without it the only way to
# recover a missed release — an expired token, a failed gate, automation that
# was still switched off — is to push another commit to `main`.
on:
  workflow_run:
    workflows:
      - tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# Merges into `main` land close enough together for two release runs to overlap.
# Cancelling is the wrong answer here: an interrupted run can leave the release
# pull request half written, so later runs queue instead.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    # Release automation is opt-in. Descendants of this starter kit keep it off
    # until they set the `RELEASE_ENABLED` repository variable to `true` and add
    # a fine-grained `RELEASE_PLEASE_TOKEN` with Contents, Pull requests, and
    # Issues read/write access.
    #
    # The event check keeps releases following pushes to `main` and nothing
    # else, so any trigger later added to `tests` cannot reach this workflow by
    # accident.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push')) &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `secrets` is unavailable in a job-level `if`, so the token guard lives
      # here instead of failing the run with an authentication error.
      - name: Verify the release token is configured
        id: token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo '::warning::RELEASE_PLEASE_TOKEN is not configured; skipping release automation.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update the release pull request
        if: steps.token.outputs.configured == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
