packages:
  - '.'

# Puppeteer's install script downloads its own Chrome build. It is declined on
# purpose: PDF rendering points Browsershot at a Chrome the environment already
# provides (Playwright's in CI, the operator's in production), so allowing the
# download would fetch a second copy in every job that installs dependencies.
# See README's system prerequisites for what production has to supply instead.
allowBuilds:
  puppeteer: false
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - fast-uri@3.1.5

overrides:
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.9
  'fast-uri@3': 3.1.5
  'decode-uri-component@0.2.0': 0.2.2
  'glob@11.0.0': 11.1.0
  'ini@1.3.4': 1.3.8

publicHoistPattern:
  - '@inertiajs/core'
